<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 224">
  <defs>
    <filter id="btnGlow" x="-20%" y="-45%" width="140%" height="190%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#d9c57b" flood-opacity=".22"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#f4cf78" flood-opacity=".42"/>
    </filter>
    <filter id="jadeGrain">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .08" numOctaves="3" seed="42"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.03 0 0 0 0 0.18 0 0 0 0 0.10 0 0 0 .22 0"/>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="goldStroke" x1="0" y1=".1" x2="1" y2=".9">
      <stop offset="0" stop-color="#fff6bd"/>
      <stop offset=".24" stop-color="#d7a949"/>
      <stop offset=".52" stop-color="#8b531b"/>
      <stop offset=".78" stop-color="#f2cc6a"/>
      <stop offset="1" stop-color="#764015"/>
    </linearGradient>
    <linearGradient id="jadeFill" x1=".08" y1=".05" x2=".95" y2=".92">
      <stop offset="0" stop-color="#add39a"/>
      <stop offset=".2" stop-color="#589864"/>
      <stop offset=".58" stop-color="#2a7046"/>
      <stop offset="1" stop-color="#154331"/>
    </linearGradient>
    <radialGradient id="shine" cx=".22" cy=".15" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset=".22" stop-color="#dff1bd" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#315f3e" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2f6f4c" stop-opacity=".22"/>
    </radialGradient>
  </defs>
  <g filter="url(#btnGlow)">
    <rect x="22" y="45" width="376" height="134" rx="67" fill="url(#jadeFill)" filter="url(#jadeGrain)"/>
    <rect x="22" y="45" width="376" height="134" rx="67" fill="url(#shine)"/>
    <path d="M55 69c66 17 156-15 306 4" fill="none" stroke="#fbffd9" stroke-width="3.2" stroke-linecap="round" opacity=".14"/>
    <path d="M56 148c78-24 196 16 306-25" fill="none" stroke="#2f6f4c" stroke-width="1.4" stroke-linecap="round" opacity=".12"/>
    <rect x="25" y="48" width="370" height="128" rx="64" fill="none" stroke="url(#goldStroke)" stroke-width=".9" opacity=".72"/>
    <rect x="29" y="52" width="362" height="120" rx="60" fill="none" stroke="#fff3bd" stroke-width=".45" opacity=".18"/>
  </g>
</svg>
