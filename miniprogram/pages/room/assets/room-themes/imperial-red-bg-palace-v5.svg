<svg preserveAspectRatio="none" width="720" height="1440" viewBox="0 0 720 1440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="palaceWall" x1="360" y1="0" x2="360" y2="1440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B070A"/>
      <stop offset="0.18" stop-color="#671115"/>
      <stop offset="0.48" stop-color="#941B20"/>
      <stop offset="0.78" stop-color="#681115"/>
      <stop offset="1" stop-color="#260306"/>
    </linearGradient>
    <linearGradient id="goldBeam" x1="0" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A4817"/>
      <stop offset="0.14" stop-color="#D09A3A"/>
      <stop offset="0.5" stop-color="#FFE39A"/>
      <stop offset="0.86" stop-color="#D09A3A"/>
      <stop offset="1" stop-color="#7A4817"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 545) rotate(90) scale(610 270)">
      <stop offset="0" stop-color="#E34D3E" stop-opacity="0.44"/>
      <stop offset="0.48" stop-color="#BC282D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5A0C10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 96) rotate(90) scale(250 360)">
      <stop offset="0" stop-color="#FFD67A" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#D85032" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5A0C10" stop-opacity="0"/>
    </radialGradient>
