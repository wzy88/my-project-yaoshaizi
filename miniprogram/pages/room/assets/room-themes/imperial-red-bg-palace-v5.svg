      <path d="M0 46H92M46 0V92M0 92L92 0" stroke="#FFD986" stroke-opacity="0.018" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.046" numOctaves="3" seed="65" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.07 0 0 0 0 0.06 0 0 0 0.12 0" result="tint"/>
      <feBlend in="SourceGraphic" in2="tint" mode="soft-light"/>
    </filter>
