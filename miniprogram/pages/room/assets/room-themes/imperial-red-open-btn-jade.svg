<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168">
  <defs>
    <filter id="btnGlow" x="-20%" y="-45%" width="140%" height="190%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#d9c57b" flood-opacity=".2"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f4cf78" flood-opacity=".42"/>
    </filter>
    <filter id="jadeGrain">
      <feTurbulence type="fractalNoise" baseFrequency=".03 .08" numOctaves="3" seed="51"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.03 0 0 0 0 0.17 0 0 0 0 0.10 0 0 0 .22 0"/>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="goldStroke" x1="0" y1=".1" x2="1" y2=".9">
      <stop offset="0" stop-color="#fff6bd"/>
      <stop offset=".24" stop-color="#d7a949"/>
      <stop offset=".52" stop-color="#8b531b"/>
      <stop offset=".78" stop-color="#f2cc6a"/>
      <stop offset="1" stop-color="#764015"/>
    </linearGradient>
    <linearGradient id="jadeFill" x1=".08" y1=".05" x2=".95" y2=".92">
      <stop offset="0" stop-color="#add49a"/>
      <stop offset=".2" stop-color="#589864"/>
      <stop offset=".58" stop-color="#2a6f46"/>
      <stop offset="1" stop-color="#154331"/>
    </linearGradient>
    <radialGradient id="shine" cx=".22" cy=".16" r=".82">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".74"/>
      <stop offset=".25" stop-color="#dff1bd" stop-opacity=".3"/>
      <stop offset=".62" stop-color="#315f3e" stop-opacity=".1"/>
      <stop offset="1" stop-color="#2f6f4c" stop-opacity=".22"/>
    </radialGradient>
  </defs>
  <g filter="url(#btnGlow)">
    <rect x="14" y="22" width="292" height="124" rx="62" fill="url(#jadeFill)" filter="url(#jadeGrain)"/>
    <rect x="14" y="22" width="292" height="124" rx="62" fill="url(#shine)"/>
    <path d="M39 45c54 14 124-12 240 4" fill="none" stroke="#fbffd9" stroke-width="2.6" stroke-linecap="round" opacity=".14"/>
    <path d="M40 123c62-20 152 12 240-20" fill="none" stroke="#2f6f4c" stroke-width="1.2" stroke-linecap="round" opacity=".12"/>
    <rect x="16.5" y="24.5" width="287" height="119" rx="59.5" fill="none" stroke="url(#goldStroke)" stroke-width=".8" opacity=".72"/>
    <rect x="20" y="28" width="280" height="112" rx="56" fill="none" stroke="#fff3bd" stroke-width=".4" opacity=".18"/>
  </g>
</svg>
